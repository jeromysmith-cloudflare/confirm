<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Schedule Request</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; max-width: 560px; }
    label { display:block; margin: 12px 0 6px; font-weight: 600; }
    input, select, button, textarea { width: 100%; padding: 10px; font-size: 16px; }
    button { margin-top: 16px; cursor: pointer; }
    .muted { color:#666; font-size: 14px; margin-top: 8px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    .row { display:flex; gap: 12px; }
    .row > div { flex:1; }
    .ok { color: #0a7; }
    .err { color: #c33; }
    .hide { display:none; }
  </style>
</head>
<body>
  <h2>Schedule / Availability</h2>

  <div class="card">
    <div id="caseBanner" class="muted"></div>

    <form id="f">
      <input type="hidden" id="caseId" name="caseId" />
      <input type="hidden" id="sig" name="sig" />

      <label for="resourceId">Resource</label>
      <select id="resourceId" name="resourceId" required>
        <option value="">Loading…</option>
      </select>

      <div class="row">
        <div>
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required />
        </div>
        <div>
          <label for="time">Time</label>
          <input id="time" name="time" type="time" required />
        </div>
      </div>

      <label for="notes">Notes (optional)</label>
      <textarea id="notes" name="notes" rows="3" placeholder="Any additional info…"></textarea>

      <button type="submit">Submit</button>
      <div id="status" class="muted"></div>
    </form>
  </div>

  <script>
    // --- helpers ---
    const $ = (id) => document.getElementById(id);
    const qp = new URLSearchParams(location.search);
    const caseId = qp.get("id") || qp.get("case") || "";
    const sig = qp.get("sig") || "";

    $("caseId").value = caseId;
    $("sig").value = sig;

    if (!caseId) {
      $("caseBanner").innerHTML = `<span class="err">Missing case id. Use a link like ?id=6546546</span>`;
      $("f").classList.add("hide");
    } else {
      $("caseBanner").textContent = `Case: ${caseId}`;
    }

async function donotuse_loadResources() {  // looking for Resources using KV
  try {
    const r = await fetch("/api/resources?id=" + encodeURIComponent(caseId) + "&_=" + Date.now());
    if (!r.ok) throw new Error("Failed to load resources");

    const data = await r.json(); // <-- this is already the array

    const sel = $("resourceId");
    sel.innerHTML = `<option value="">Select…</option>`;

    for (const item of data) {
      const opt = document.createElement("option");
      opt.value = item.id;
      opt.textContent = item.label;
      sel.appendChild(opt);
    }
  } catch (e) {
    $("resourceId").innerHTML =
      `<option value="">(Could not load resources)</option>`;
    console.error(e);
  }
}


// Populate resources from Worker
async function loadResources() {
  try {
    const params = new URLSearchParams(window.location.search);
    const variant = params.get("v") || "tps";

    const r = await fetch(
      `/api/resources?id=${encodeURIComponent(caseId)}&v=${encodeURIComponent(variant)}`
    );

    if (!r.ok) throw new Error("Failed to load resources");

    const data = await r.json();

    const sel = $("resourceId");
    sel.innerHTML = `<option value="">Select…</option>`;

    const list = Array.isArray(data) ? data : (data.resources || []);

    for (const item of list) {
      const opt = document.createElement("option");
      opt.value = item.id;
      opt.textContent = item.label;
      sel.appendChild(opt);
    }
  } catch (e) {
    $("resourceId").innerHTML =
      `<option value="">(Could not load resources)</option>`;
    console.error(e);
  }
}

if (caseId) loadResources();    

    
    // Populate resources (you can hardcode, or fetch from Worker)
async function donotuse2_loadResources() {
  try {
    const r = await fetch("/api/resources?id=" + encodeURIComponent(caseId));
    if (!r.ok) throw new Error("Failed to load resources");

    const data = await r.json(); // <-- this is already the array

    const sel = $("resourceId");
    sel.innerHTML = `<option value="">Select…</option>`;

    const list = Array.isArray(data) ? data : (data.resources || []);

    for (const item of list) {

    // Removing line -- for (const item of data) {
      const opt = document.createElement("option");
      opt.value = item.id;
      opt.textContent = item.label;
      sel.appendChild(opt);
    }
  } catch (e) {
    $("resourceId").innerHTML =
      `<option value="">(Could not load resources)</option>`;
    console.error(e);
  }
}
    if (caseId) loadResources();

    // Submit to Worker
    $("f").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      $("status").textContent = "Submitting…";
      $("status").className = "muted";

      const payload = {
        caseId: $("caseId").value,
        sig: $("sig").value,
        resourceId: $("resourceId").value,
        date: $("date").value,
        time: $("time").value,
        variant: (
    new URLSearchParams(window.location.search).get("v") || "tps"
  ).toUpperCase(),
        notes: $("notes").value || ""
      };

      try {
        const r = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const out = await r.json().catch(() => ({}));

        if (!r.ok) {
          throw new Error(out.message || `Submit failed (${r.status})`);
        }

        $("status").textContent = "Submitted successfully.";
        $("status").className = "muted ok";
        $("f").reset();
      } catch (e) {
        $("status").textContent = e.message;
        $("status").className = "muted err";
      }
    });
  </script>
</body>
</html>
